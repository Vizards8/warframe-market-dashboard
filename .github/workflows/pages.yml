name: Publish market dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'orders: 刷挂单约 9–11 分钟 / full: 全量约 22–25 分钟 / publish: 仅发布缓存'
        type: choice
        options: [orders, full, publish]
        default: orders
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize all cache writers and deployments, including the second publication.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.slow_deployment.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore public market cache
        id: market_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/market.json
            data/riven_market.json
            data/refresh_status.json
          key: market-v2-${{ github.run_id }}-${{ github.run_attempt }}-restore
          restore-keys: market-v2-
      # Cache versions include the path list. Restore the old two-file cache
      # separately when migrating; adding refresh_status changes the version.
      - name: Restore legacy market cache on first upgraded run
        if: steps.market_cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            data/market.json
            data/riven_market.json
          key: market-v1-${{ github.run_id }}-${{ github.run_attempt }}-migration
          restore-keys: market-v1-
      - name: Validate calculations and public export
        run: |
          python -m unittest discover -s tests -v
          node tests/test_stats.js
      - name: Refresh online orders
        id: orders
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish')
        run: python scripts/refresh_market.py --mode orders
      - name: Cache online orders
        if: steps.orders.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/market.json
            data/riven_market.json
            data/refresh_status.json
          key: market-v2-${{ github.run_id }}-${{ github.run_attempt }}-orders
      - name: Build site with updated orders
        run: python scripts/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish orders without waiting for slow data
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Refresh trade statistics when due
        id: stats
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        env:
          REFRESH_DUE: ${{ github.event_name == 'schedule' && '--due' || '' }}
        run: python scripts/refresh_market.py --mode stats $REFRESH_DUE
      - name: Cache refreshed statistics
        if: steps.stats.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/market.json
            data/riven_market.json
            data/refresh_status.json
          key: market-v2-${{ github.run_id }}-${{ github.run_attempt }}-stats
      - name: Refresh zero-roll Rivens when due
        id: rivens
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        env:
          REFRESH_DUE: ${{ github.event_name == 'schedule' && '--due' || '' }}
        run: python scripts/refresh_market.py --mode rivens $REFRESH_DUE
      - name: Cache statistics and Rivens
        if: steps.stats.outputs.updated == 'true' || steps.rivens.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/market.json
            data/riven_market.json
            data/refresh_status.json
          key: market-v2-${{ github.run_id }}-${{ github.run_attempt }}-slow
      - name: Build site with refreshed statistics and Rivens
        if: steps.stats.outputs.updated == 'true' || steps.rivens.outputs.updated == 'true'
        run: python scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.stats.outputs.updated == 'true' || steps.rivens.outputs.updated == 'true'
        with:
          name: github-pages-slow
          path: _site
      - name: Publish statistics and Rivens
        id: slow_deployment
        if: steps.stats.outputs.updated == 'true' || steps.rivens.outputs.updated == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-slow
